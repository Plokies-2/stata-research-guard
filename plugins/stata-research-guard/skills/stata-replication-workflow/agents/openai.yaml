interface:
  display_name: "Stata Research Workflow"
  short_description: "Help-first Stata 18 command and research evidence"
  default_prompt: "Use $stata-replication-workflow to write or refactor researcher-readable Stata from the actual project. For substantial workflow work, critically read a relevant paper's connected data-to-output code independently of command-help needs; choose a better source when useful. Prefer documented command automation, keep specifications visible, and integrate the comparison into concrete peer advice."

dependencies:
  tools:
    - type: "mcp"
      value: "stataResearchGuard"
      description: "Open-ended Stata command evidence with a compact discovery index, live installed-help fallback, main rules, command-selective expanded documentation, and selected raw paper context"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
