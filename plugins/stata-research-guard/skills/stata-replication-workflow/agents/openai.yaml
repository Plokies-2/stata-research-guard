interface:
  display_name: "Stata Research Workflow"
  short_description: "Help-first Stata 18 command and research evidence"
  default_prompt: "Use $stata-replication-workflow to write or refactor researcher-readable Stata from the actual project. Keep broad research stages and visible specifications, consult original command evidence as needed, and use concrete independent peer advice for substantive code changes."

dependencies:
  tools:
    - type: "mcp"
      value: "stataResearchGuard"
      description: "Open-ended Stata command evidence with a compact discovery index, live installed-help fallback, main rules, command-selective expanded documentation, and selected raw paper context"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
