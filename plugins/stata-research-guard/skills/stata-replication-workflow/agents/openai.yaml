interface:
  display_name: "Stata Research Workflow"
  short_description: "Researcher-readable Stata from data to outputs"
  default_prompt: "Use $stata-replication-workflow to inspect the actual project and write, refactor, or run Stata whose research reasoning and outputs are easy to follow."

dependencies:
  tools:
    - type: "mcp"
      value: "stataResearchGuard"
      description: "Open-ended Stata command evidence with a compact discovery index, live installed-help fallback, main rules, command-selective expanded documentation, and selected raw paper context"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
