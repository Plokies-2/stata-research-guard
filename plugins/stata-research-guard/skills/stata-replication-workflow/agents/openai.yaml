interface:
  display_name: "Stata Research Workflow"
  short_description: "Template-guided, flexible Stata research workflows"
  default_prompt: "Use $stata-replication-workflow to inspect this research workflow read-only. Apply the general rules to every substantive transition and every template selection, binding, adaptation, and verification. Select a genuinely close labeled block only when permitted bindings leave the complete atomic transition intact; otherwise use general_rule and keep the nearest inspected candidate only as a nonbinding hint. Prioritize correctness, point-of-use readability, artifact-based restartability, then brevity, DRY, and modularity. Preserve a compatible existing layout during partial repair. For a new applied-micro panel project or approved overhaul that actually needs preparation, summary, and estimation, default to unnumbered masters.do, do/build_analysis_panel.do, do/build_summary.do, and do/run_regressions.do; complete one analysis-ready cleaned panel first and independently reopen it for summaries and regressions. Otherwise create only the requested stages and outputs. A coherent do-file around 1000 lines may remain intact because this is guidance, not a lint threshold. As this plugin's researcher-readability house style rather than a universal Stata textbook rule, use a literal for a one-use binding and otherwise define or redefine a descriptive global in the consuming do-file. Keep shared directory roots in masters.do and outcome-list globals in run_regressions.do. In newly generated or currently revised regression code, reserve local for obvious lexical cases inside loops or programs, temp objects, per-iteration scratch, or an immediately consumed r()/e() result. Keep every authored regression treatment or event window, control, sample, fixed effect, weight, and VCE literal at zero substantive reference depth; only one local outcome iterator in one flat loop is normally allowed. Never chain aliases. Do not infer lexical necessity across every Stata context or block untouched existing code on these house-style preferences. Compact native selected levels such as i(2015/2018 2020/2024).year#1.treat2019 remain a good official example, but do not auto-select them before Stata runtime confirms actual factor support, the omitted level, and exact raw e(b) names; use a level-specific no-base list for an irregular window or unconfirmed coefficient contract. Stata categorical factor levels must be nonnegative integers, so recode signed relative time to a nonnegative factor index and restore negative relative-time text only in graph labels. At the top of masters.do list exact Project Inputs and Project Outputs. Associate each do call with exact Input, exact Output or Output: none, and a concise Korean role comment. File inventories are the blocking contract; role grammar, punctuation, and blank-line adjacency are advisory. Format long lists clearly and use /// only for an immediately continued command. Preserve hard output and safety contracts, keep provenance markers out of research .do files, apply required, optional, or disabled report_policy exactly, and verify only the approved Excel, PDF, .ster, data, and log outputs without dependency or submission packaging."

dependencies:
  tools:
    - type: "mcp"
      value: "stataResearchGuard"
      description: "Local curated Stata reference, lint, project audit, and research-output verification server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
