interface:
  display_name: "Stata Research Workflow"
  short_description: "Template-guided, flexible Stata research workflows"
  default_prompt: "Use $stata-replication-workflow to create, revise, or audit a researcher-readable Stata workflow while preserving the declared research and output contracts."

dependencies:
  tools:
    - type: "mcp"
      value: "stataResearchGuard"
      description: "Local curated Stata reference, lint, project audit, and research-output verification server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
