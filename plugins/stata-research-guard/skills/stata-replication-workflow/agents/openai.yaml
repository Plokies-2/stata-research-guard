interface:
  display_name: "Stata Research Workflow"
  short_description: "Closed Stata command dictionary with guide and paper evidence"
  default_prompt: "Use $stata-replication-workflow to inspect the allowed command dictionary, choose canonical commands, retrieve only their guide and paper evidence, follow the common general rules, and abort with the missing capability if the dictionary cannot supply it."

dependencies:
  tools:
    - type: "mcp"
      value: "stataResearchGuard"
      description: "Closed Stata command dictionary, main rules, help-first selected-command evidence, and selected raw paper context"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
