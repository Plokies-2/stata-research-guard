interface:
  display_name: "Stata Research Workflow"
  short_description: "Template-guided, flexible Stata research workflows"
  default_prompt: "Use $stata-replication-workflow to inspect this research workflow read-only. Apply the general rules to every substantive transition and every template selection, binding, adaptation, and verification. Select a genuinely close labeled block only when permitted bindings leave the complete atomic transition intact; otherwise use general_rule and keep the nearest inspected candidate only as a nonbinding hint. Prioritize correctness, point-of-use readability, artifact-based restartability, then brevity, DRY, and modularity. Preserve a compatible existing layout during partial repair. For a new applied-micro panel project or approved overhaul that actually needs preparation, summary, and estimation, default to unnumbered masters.do, do/build_analysis_panel.do, do/build_summary.do, and do/run_regressions.do; complete one analysis-ready cleaned panel first and independently reopen it for summaries and regressions. Otherwise create only the requested stages and outputs. A coherent do-file around 1000 lines may remain intact because this is guidance, not a lint threshold. Use a literal for a one-use binding and otherwise define or redefine a descriptive global in the consuming do-file. Keep shared directory roots in masters.do and outcome-list globals in run_regressions.do. Use local only for lexical necessity inside loops or programs, temp objects, per-iteration scratch, or an immediately consumed r()/e() result. Keep every regression treatment or event window, control, sample, fixed effect, weight, and VCE literal at zero substantive reference depth; only one local outcome iterator in one flat loop is normally allowed. Never chain aliases. Prefer compact native selected levels such as i(2015/2018 2020/2024).year#1.treat2019 with one # only when the displayed minimum-to-maximum support has exactly one omitted interior reference; use a level-specific no-base list for an irregular window or boundary reference. Stata categorical factor levels must be nonnegative integers, so recode signed relative time to a nonnegative factor index and restore negative relative-time text only in graph labels. Freeze selectors only after inspecting exact raw e(b) names. At the top of masters.do list exact persistent Project Inputs and Project Outputs. Immediately above each direct do, run, or include call, write a contiguous exact Input, exact persistent Output, transient Output: active dataset, or Output: none, plus a complete role-comment sentence. Use Output: active dataset only for a one-hop handoff to the immediately following call's Input: active dataset, and never list active dataset in the top-level persistent inventory. Keep workflow calls fail-fast: never use nostop on any do or run call, including a non-master helper. In the master, never use capture or any literal or macro-expanded positional argument or option after the target; a shared directory-root macro may appear only as a complete directory component inside an explicit literal leaf path. Non-master helpers may retain documented positional arguments but not nostop. Format long lists clearly and use /// only for an immediately continued command. Preserve hard output and safety contracts, keep provenance markers out of research .do files, apply required, optional, or disabled report_policy exactly, and verify only the approved Excel, PDF, .ster, data, and log outputs without dependency or submission packaging."

dependencies:
  tools:
    - type: "mcp"
      value: "stataResearchGuard"
      description: "Local curated Stata reference, lint, project audit, and research-output verification server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
