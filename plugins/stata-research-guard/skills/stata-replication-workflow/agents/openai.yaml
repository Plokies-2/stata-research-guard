interface:
  display_name: "Stata Research Workflow"
  short_description: "Official syntax and research-context evidence for Stata"
  default_prompt: "Use $stata-replication-workflow to choose and write readable Stata from official or maintainer evidence and the current project context."

dependencies:
  tools:
    - type: "mcp"
      value: "stataResearchGuard"
      description: "Local Stata command evidence, documentation examples, and factual project observations"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
