interface:
  display_name: "Stata Research Workflow"
  short_description: "Template-guided, flexible Stata research workflows"
  default_prompt: "Use $stata-replication-workflow to inspect this research workflow read-only. Apply the general rules to every substantive transition and every template selection, binding, adaptation, and verification. Select a genuinely close labeled block only when permitted bindings leave the complete atomic transition intact. If frame, algorithm, control flow, interface, or output contract must change, stop calling the result a template; split at a natural state boundary when possible, otherwise use general_rule. Retain the rank-relative nearest inspected candidate only as a nonbinding hint and state that it may still be absolutely distant or incompatible. Prefer one flat loop; allow depth two only when two plain named lists or numeric ranges repeat the same mechanical body and substantially reduce duplication without hiding research or output choices. Never use depth three. Keep shallow indentation, visible specifications, and no unnecessary abstraction. Reserve globals for intentional cross-do-file interfaces. Keep shared directory roots in setup, but put a leaf input or output filename used by only one child do-file in a local beside that consumer; preserve it as a global only when two or more do-files intentionally share the exact artifact contract. Keep repeated regression specifications and same-file event display bindings in adjacent locals, but leave a one-use list explicit when clearer. Format long variable and other enumerations as meaningfully grouped, whitespace-aligned multiline blocks; keep short lists on one line and do not reflow quoted text. Use /// only when the immediately following physical line continues the same command, indent continuation lines beyond the command start, and omit it from the final option or line. When creating a master do-file, put one Korean comment sentence immediately above every individual do call explaining the called file's project-local role, and lint it with role master. Preserve hard output and safety contracts, keep provenance markers out of research .do files, record exact template and substantive general_rule ranges in root report.md, and verify approved outputs without dependency or submission packaging."

dependencies:
  tools:
    - type: "mcp"
      value: "stataResearchGuard"
      description: "Local curated Stata reference, lint, project audit, and research-output verification server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
