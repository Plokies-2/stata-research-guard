      <stop offset="1" stop-color="#153c49"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="52" y="60" width="210" height="34" rx="17" fill="#245b6c"/>
